unbind r
unbind C-b
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set -g prefix C-Space
set -g mouse on
set -g default-terminal "tmux-256color"
set -g status-position top

# ── Kitty + tmux terminal settings ────────────────────────────────────────────
# terminal-features is the modern alternative to terminal-overrides (tmux 3.2+).
# 'RGB' enables true colour; 'sync' enables synchronized output (BSU/ESU).
set -ga terminal-features ",xterm-kitty:RGB"
set -ga terminal-features ",xterm-kitty:sync"

set -sg escape-time 10
# Lets applications (e.g. nvim) know when the tmux window gains/loses focus.
set -g focus-events on

# Disable automatic window renaming so manual names (prefix + ,) are preserved.
set -g automatic-rename 
set -g allow-rename off

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number_color "#{@thm_green}"
set -g @catppuccin_menu_selected_style "fg=#{@thm_surface_0},bold,bg=#{@thm_green}"

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

set -g message-style "fg=#{@thm_surface_0},bg=#{@thm_green},fill=#{@thm_green},bold,align=left"
set -g message-command-style "fg=#{@thm_surface_0},bg=#{@thm_green},fill=#{@thm_green},bold,align=left"
set -g mode-style "fg=#{@thm_surface_0},bg=#{@thm_green},bold"
